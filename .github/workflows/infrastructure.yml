name: Infrastructure validation
on:
  push:
    branches: [main, feat/global-pipeline-infrastructure]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Infrastructure unit tests
        run: node --test tests/infrastructure.test.mjs
      - name: Production build
        run: npm run build
      - name: Infrastructure data checks
        run: node scripts/check-infrastructure.mjs
      - name: Full project regression suite (existing failures tracked separately)
        if: always()
        continue-on-error: true
        run: npm test
